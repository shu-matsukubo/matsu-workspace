# Git config互換形式。Git以外のparserは不要です。
# ローカル開発で各モジュールが追跡するbranchを定義します。

[manifest]
	version = 1

[module "apps/matsu-front"]
	branch = develop

[module "apps/matsu-bff"]
	branch = develop

[module "apps/matsu-api"]
	branch = develop

[module "apps/matsu-auth"]
	branch = develop

[module "apps/matsu-toolbox-api"]
	branch = develop

[module "apps/matsu-arcade-auth"]
	branch = develop

[module "apps/matsu-arcade-api"]
	branch = develop

[module "docs"]
	branch = main
